<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
<title>Sahana &amp; Manoj Wedding</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Wedding of Sahana &amp; Manoj · Muhurtham Sunday, 29 November 2026, 8:50 AM · Raghavendra Swamy Kalyana Mantapam, Ballari">
<meta name="theme-color" content="#0d2b1d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Marcellus+SC&family=Pinyon+Script&family=Noto+Serif+Telugu:wght@400;600;700&family=Suranna&family=Noto+Serif+Kannada:wght@400;600;700&family=Tiro+Devanagari+Hindi:ital@0;1&display=swap">
<style>
/* Layout: emerald velvet ground; one ivory invitation sheet framed in zari; temple doors as the overture.
   A single committed look (royal green, gold, ivory), so colours are set explicitly rather than themed. */
:root{
  --emerald:#0c2a1c; --emerald-2:#123d28; --emerald-3:#1b5537;
  --gold:#c8a04a; --gold-hi:#f1d98f; --gold-lo:#8a6823;
  --ivory:#fcf7ec; --ivory-2:#f3e9d2; --ink:#2a2214; --ink-soft:#6a5a3b;
  --maroon:#8b1d2c; --marigold:#ef8a1d;
  --f-body:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --f-name:'Pinyon Script','Cormorant Garamond',cursive;
  --f-label:'Marcellus SC','Cormorant Garamond',Georgia,serif;
  --name-size:clamp(3.3rem,16vw,4.7rem);
  --body-size:1.2rem; --small:1rem; --track:.14em; --lh:1.5;
  color-scheme:light;
}
[data-lang="te"]{--f-body:'Noto Serif Telugu','Noto Sans Telugu',serif;--f-name:'Suranna','Noto Serif Telugu',serif;--f-label:'Noto Serif Telugu',serif;--name-size:clamp(2.9rem,13.5vw,4.1rem);--body-size:1.02rem;--small:.9rem;--track:0;--lh:1.75}
[data-lang="kn"]{--f-body:'Noto Serif Kannada','Noto Sans Kannada',serif;--f-name:'Noto Serif Kannada',serif;--f-label:'Noto Serif Kannada',serif;--name-size:clamp(2.5rem,12vw,3.6rem);--body-size:1rem;--small:.88rem;--track:0;--lh:1.75}
[data-lang="hi"]{--f-body:'Tiro Devanagari Hindi','Noto Serif Devanagari',serif;--f-name:'Tiro Devanagari Hindi','Noto Serif Devanagari',serif;--f-label:'Tiro Devanagari Hindi',serif;--name-size:clamp(2.9rem,13.5vw,4.1rem);--body-size:1.12rem;--small:.98rem;--track:0;--lh:1.65}

*{box-sizing:border-box}
html,body{background:var(--emerald)}
body{
  color:var(--ink); font-family:var(--f-body); font-size:var(--body-size); line-height:var(--lh);
  background:
    radial-gradient(circle at 50% 0%, rgba(241,217,143,.10), transparent 60%),
    radial-gradient(rgba(200,160,74,.10) 1px, transparent 1.4px) 0 0/22px 22px,
    var(--emerald);
  min-height:100vh; font-variant-numeric:lining-nums;
}
body.locked{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold-hi);outline-offset:3px;border-radius:6px}

/* ---------- Language picker ---------- */
.picker{
  position:fixed;inset:0;z-index:70;display:grid;place-items:center;
  padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:
    radial-gradient(ellipse at 50% 35%, rgba(241,217,143,.16), transparent 60%),
    radial-gradient(rgba(200,160,74,.12) 1px, transparent 1.4px) 0 0/22px 22px,
    #0a2318;
  transition:opacity .7s ease, visibility .7s;
}
.picker.hide{opacity:0;visibility:hidden}
.picker-inner{width:min(100%,24rem);text-align:center;color:var(--ivory);display:grid;gap:1.4rem;justify-items:center}
.picker .emblem{width:84px;height:84px}
.picker .om{font-family:'Tiro Devanagari Hindi',serif;color:var(--gold-hi);font-size:1.05rem;letter-spacing:.04em}
.picker h1{margin:0;font-family:'Cormorant Garamond',serif;font-weight:600;font-size:1.5rem;color:var(--gold-hi);letter-spacing:.02em}
.picker .prompts{margin:0;display:grid;gap:.15rem;font-size:.92rem;color:rgba(252,247,236,.78)}
.picker .prompts span:nth-child(1){font-family:'Noto Serif Telugu',serif}
.picker .prompts span:nth-child(2){font-family:'Noto Serif Kannada',serif}
.picker .prompts span:nth-child(3){font-family:'Tiro Devanagari Hindi',serif}
.lang-grid{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;width:100%}
.lang-btn{
  min-height:5.2rem;border-radius:14px;border:1px solid rgba(200,160,74,.55);
  background:linear-gradient(180deg,rgba(27,85,55,.9),rgba(12,42,28,.95));
  box-shadow:inset 0 0 0 4px rgba(12,42,28,.9), inset 0 0 0 5px rgba(200,160,74,.35), 0 8px 22px rgba(0,0,0,.35);
  color:var(--ivory);display:grid;place-items:center;gap:.1rem;padding:.6rem;
  transition:transform .2s ease, border-color .2s ease, background .2s ease;
}
.lang-btn:hover,.lang-btn:focus-visible{transform:translateY(-2px);border-color:var(--gold-hi)}
.lang-btn b{font-weight:600;font-size:1.5rem;line-height:1.2;color:var(--gold-hi)}
.lang-btn small{font-family:'Marcellus SC',serif;font-size:.72rem;letter-spacing:.16em;color:rgba(252,247,236,.65)}
.lang-btn[data-l="te"] b{font-family:'Suranna','Noto Serif Telugu',serif;font-size:1.75rem}
.lang-btn[data-l="kn"] b{font-family:'Noto Serif Kannada',serif}
.lang-btn[data-l="hi"] b{font-family:'Tiro Devanagari Hindi',serif;font-size:1.65rem}
.lang-btn[data-l="en"] b{font-family:'Cormorant Garamond',serif;font-size:1.6rem}
.sound-hint{margin:0;font-size:.85rem;color:rgba(252,247,236,.6);font-family:'Cormorant Garamond',serif;font-style:italic;display:flex;gap:.45rem;align-items:center}

/* ---------- Temple doors ---------- */
.gate{position:fixed;inset:0;z-index:60;perspective:1800px;overflow:hidden;pointer-events:auto}
.gate.gone{opacity:0;visibility:hidden;transition:opacity .9s ease 1.5s, visibility 0s linear 2.4s}
.glow{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%, rgba(255,226,150,.95), rgba(255,190,90,.35) 35%, transparent 70%);opacity:0;transition:opacity 1.2s ease .3s;pointer-events:none}
.gate.open .glow{opacity:1}
.door{
  position:absolute;top:0;bottom:0;width:50.2%;
  background:
    linear-gradient(90deg, rgba(0,0,0,.25), transparent 18%, transparent 82%, rgba(0,0,0,.25)),
    repeating-linear-gradient(90deg, rgba(255,255,255,.015) 0 3px, rgba(0,0,0,.03) 3px 7px),
    linear-gradient(180deg,#174a31,#0f3622 55%,#0b2a1b);
  transition:transform 2.4s cubic-bezier(.65,.02,.2,1);
  transform-style:preserve-3d; backface-visibility:hidden;
  box-shadow:0 0 0 1px rgba(0,0,0,.4);
}
.door.l{left:0;transform-origin:left center;border-right:2px solid var(--gold-lo)}
.door.r{right:0;transform-origin:right center;border-left:2px solid var(--gold-lo)}
.gate.open .door.l{transform:rotateY(-112deg)}
.gate.open .door.r{transform:rotateY(112deg)}
.door .frame{position:absolute;inset:clamp(12px,3.5vw,22px);border:2px solid var(--gold);border-radius:4px;box-shadow:inset 0 0 0 6px rgba(12,42,28,.7), inset 0 0 0 7px rgba(200,160,74,.45)}
.door .frame.top{bottom:52%}
.door .frame.bot{top:52%}
.door .carve{position:absolute;left:50%;width:min(70%,170px);aspect-ratio:1;transform:translate(-50%,-50%);opacity:.9}
.door .carve.c1{top:26%}
.door .carve.c2{top:76%}
.door .ring{position:absolute;top:50%;width:30px;height:30px;margin-top:-15px;border-radius:50%;border:4px solid var(--gold);box-shadow:0 2px 4px rgba(0,0,0,.5), inset 0 0 3px rgba(0,0,0,.4)}
.door .ring::before{content:"";position:absolute;left:50%;top:-12px;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:radial-gradient(circle at 35% 35%,var(--gold-hi),var(--gold-lo))}
.door.l .ring{right:12px}
.door.r .ring{left:12px}
.gate .toran{position:absolute;top:0;left:0;right:0;z-index:3;transition:transform 1.6s ease .2s, opacity 1.2s ease .2s}
.gate.open .toran{transform:translateY(-110%);opacity:0}
.plaque{
  position:absolute;left:50%;top:50%;z-index:4;transform:translate(-50%,-50%);
  width:min(calc(100% - 48px),21rem);
  background:linear-gradient(180deg,var(--ivory),var(--ivory-2));
  border-radius:12px;padding:1.6rem 1.2rem 1.4rem;text-align:center;
  box-shadow:0 0 0 2px var(--gold), 0 0 0 6px rgba(12,42,28,.85), 0 0 0 7px var(--gold-lo), 0 24px 60px rgba(0,0,0,.55);
  transition:opacity .6s ease, transform .6s ease; display:grid;gap:.55rem;justify-items:center;
}
.gate.open .plaque{opacity:0;transform:translate(-50%,-50%) scale(.9)}
.plaque .inv{color:var(--maroon);font-size:var(--small);margin:0}
.plaque .names{font-family:var(--f-name);font-size:calc(var(--name-size)*.62);line-height:1.15;color:var(--emerald-2);margin:.1rem 0 0}
.plaque .names i{font-style:italic;color:var(--gold-lo);font-family:'Cormorant Garamond',serif;font-weight:500;padding:0 .2em;font-size:.8em}
.plaque .date{font-family:var(--f-label);letter-spacing:var(--track);font-size:var(--small);color:var(--ink-soft);margin:0}
.btn-open{
  margin-top:.5rem;border:0;border-radius:999px;padding:.75rem 1.5rem;
  background:linear-gradient(180deg,#1f6040,#123d28);color:var(--gold-hi);
  font-family:var(--f-label);letter-spacing:var(--track);font-size:1rem;
  box-shadow:0 0 0 1px var(--gold), 0 6px 18px rgba(18,61,40,.4);
  animation:breathe 2.6s ease-in-out infinite;
}
@keyframes breathe{50%{box-shadow:0 0 0 1px var(--gold),0 0 0 7px rgba(200,160,74,.18),0 6px 18px rgba(18,61,40,.4)}}

/* ---------- Page ---------- */
.page{padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:20px 110px}
.sheet{
  max-width:34rem;margin:0 auto;position:relative;
  background:
    radial-gradient(ellipse at 50% 0%, rgba(255,255,255,.7), transparent 60%),
    linear-gradient(180deg,var(--ivory),var(--ivory-2));
  border-radius:6px;overflow:hidden;
  box-shadow:0 0 0 2px var(--gold), 0 0 0 7px var(--emerald-2), 0 0 0 8px var(--gold-lo), 0 30px 80px rgba(0,0,0,.5);
}
.zari{height:14px;background:
  linear-gradient(135deg,var(--emerald-2) 33%,transparent 33%) 0 0/14px 14px,
  linear-gradient(225deg,var(--emerald-2) 33%,transparent 33%) 0 0/14px 14px,
  linear-gradient(180deg,var(--gold-hi),var(--gold) 60%,var(--gold-lo));
  border-block:1px solid var(--gold-lo)}
.zari.flip{transform:scaleY(-1)}
.toran{display:block;width:100%;height:auto}
section{padding:2.2rem 1.4rem;text-align:center;position:relative}
section+section::before{content:"";position:absolute;top:0;left:18%;right:18%;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.eyebrow{margin:0;font-family:var(--f-label);letter-spacing:var(--track);font-size:var(--small);color:var(--gold-lo);text-transform:none}
h2{margin:.2rem 0 1.2rem;font-family:var(--f-label);font-weight:600;letter-spacing:var(--track);font-size:1.45rem;color:var(--emerald-2);text-wrap:balance}
[data-lang="en"] h2{font-weight:400}
.flourish{display:block;margin:.4rem auto 0;width:150px;height:14px}

/* hero */
.hero{padding-top:.6rem}
.hero .emblem{width:92px;height:92px;margin:0 auto .2rem;display:block}
.invocation{margin:0;color:var(--maroon);font-weight:600;font-size:1.02rem}
.shubha{margin:.35rem 0 0;font-family:var(--f-label);letter-spacing:var(--track);font-size:1.15rem;color:var(--emerald-3)}
.couple-big{margin:.9rem 0 .4rem;font-family:var(--f-name);font-weight:400;font-size:var(--name-size);line-height:1.08;color:var(--emerald-2);display:grid;justify-items:center}
[data-lang="kn"] .couple-big{font-weight:700}
.couple-big .amp{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:500;font-size:.5em;color:var(--gold);line-height:.9}
.hero-date{margin:.6rem 0 0;font-family:var(--f-label);letter-spacing:var(--track);font-size:1.05rem;color:var(--ink)}
.hero-venue{margin:.1rem 0 0;color:var(--ink-soft);font-size:var(--small)}
.countdown{margin:1.5rem auto 0;max-width:22rem;background:linear-gradient(180deg,#174a31,#0f3622);border-radius:14px;padding:1rem .8rem 1.1rem;color:var(--ivory);box-shadow:0 0 0 1px var(--gold), 0 0 0 4px var(--ivory), 0 0 0 5px rgba(200,160,74,.6), 0 14px 30px rgba(12,42,28,.25)}
.countdown .cd-title{margin:0 0 .5rem;font-family:var(--f-label);letter-spacing:var(--track);font-size:var(--small);color:var(--gold-hi)}
.cd-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:.3rem}
.cd-grid div{display:grid;gap:.1rem}
.cd-grid b{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:2.1rem;line-height:1;font-variant-numeric:lining-nums tabular-nums;color:var(--ivory)}
.cd-grid span{font-size:.72rem;color:rgba(252,247,236,.72);line-height:1.3}
[data-lang="en"] .cd-grid span{font-family:var(--f-label);letter-spacing:.12em}
.cd-done{margin:0;font-size:1.1rem;color:var(--gold-hi)}
.actions{display:flex;flex-wrap:wrap;gap:.6rem;justify-content:center;margin-top:1.3rem}
.btn{
  display:inline-flex;align-items:center;gap:.45rem;justify-content:center;text-decoration:none;
  border-radius:999px;padding:.6rem 1.1rem;font-size:.95rem;line-height:1.2;
  border:1px solid var(--gold);background:var(--ivory);color:var(--emerald-2);font-family:var(--f-label);letter-spacing:calc(var(--track)*.6);
  transition:background .2s ease,color .2s ease;
}
.btn:hover{background:var(--emerald-2);color:var(--gold-hi)}
.btn.solid{background:var(--emerald-2);color:var(--gold-hi)}
.btn.solid:hover{background:var(--emerald-3)}
.btn svg{width:16px;height:16px;flex:none}

/* invitation text & couple */
.invite-text{margin:0 auto;max-width:28rem;color:var(--ink);font-style:italic;text-wrap:pretty}
[data-lang="te"] .invite-text,[data-lang="kn"] .invite-text{font-style:normal}
.person{margin-top:1.4rem;display:grid;gap:.15rem;justify-items:center}
.person .role{font-family:var(--f-label);letter-spacing:var(--track);font-size:.8rem;color:var(--gold-lo)}
[data-lang="en"] .person .role{text-transform:uppercase;font-size:.72rem}
.person .full{margin:0;font-family:var(--f-name);font-size:calc(var(--name-size)*.62);line-height:1.2;color:var(--emerald-2)}
[data-lang="kn"] .person .full{font-weight:700}
.person .full small{font-family:var(--f-body);font-size:.42em;color:var(--gold-lo);font-weight:600;vertical-align:.35em;margin-right:.3em}
[data-lang="en"] .person .full small{font-family:var(--f-label);letter-spacing:.1em}
.person .parents{margin:0;color:var(--ink-soft);font-size:var(--small);font-style:italic;max-width:24rem}
[data-lang="te"] .person .parents,[data-lang="kn"] .person .parents{font-style:normal}
.amp-mid{margin:1rem 0 0;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:2.4rem;line-height:1;color:var(--gold)}
.bless{margin:1.5rem auto 0;max-width:26rem;color:var(--maroon)}

/* events */
.timeline{list-style:none;margin:0;padding:0;display:grid;gap:1rem;text-align:left}
.ev{
  display:grid;grid-template-columns:52px 1fr;gap:.9rem;align-items:start;
  padding:1rem 1rem 1.05rem;border-radius:12px;background:rgba(255,255,255,.55);
  border:1px solid rgba(200,160,74,.45);
}
.ev .ic{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#fff8e3,var(--ivory-2));box-shadow:0 0 0 1px var(--gold), 0 0 0 4px rgba(200,160,74,.15)}
.ev .ic svg{width:30px;height:30px}
.ev-body{min-width:0;display:grid;gap:.15rem}
.ev h3{margin:0;font-family:var(--f-label);letter-spacing:var(--track);font-weight:600;font-size:1.2rem;color:var(--emerald-2);display:flex;flex-wrap:wrap;align-items:center;gap:.5rem}
[data-lang="en"] .ev h3{font-weight:400}
.ev .when{margin:0;font-weight:600;color:var(--ink);display:grid}
.ev .when span+span{font-size:1.08em}
.ev .where{margin:0;color:var(--ink-soft);font-size:var(--small)}
.ev .cal{margin-top:.45rem;justify-self:start;font-size:.85rem;padding:.42rem .85rem}
.chip{font-family:var(--f-body);letter-spacing:0;font-size:.72rem;font-weight:600;padding:.12rem .55rem;border-radius:999px;background:var(--marigold);color:#fff;line-height:1.5}
.chip.done{background:var(--ink-soft)}
.ev.main{background:linear-gradient(180deg,#174a31,#0f3622);border-color:var(--gold);color:var(--ivory);box-shadow:0 0 0 3px var(--ivory),0 0 0 4px rgba(200,160,74,.7),0 12px 28px rgba(12,42,28,.25)}
.ev.main h3{color:var(--gold-hi)}
.ev.main .when{color:var(--ivory);font-size:1.15em}
.ev.main .where{color:rgba(252,247,236,.78)}
.ev.main .ic{background:radial-gradient(circle at 35% 30%,#2a6b48,#123d28)}
.ev.main .cal{background:transparent;color:var(--gold-hi);border-color:var(--gold)}
.ev.main .cal:hover{background:var(--gold);color:var(--emerald)}
.day-label{margin:.4rem 0 -.3rem;font-family:var(--f-label);letter-spacing:var(--track);font-size:var(--small);color:var(--gold-lo);text-align:center}

/* venue */
.venue-name{margin:0;font-family:var(--f-label);letter-spacing:var(--track);font-size:1.25rem;font-weight:600;color:var(--emerald-2);text-wrap:balance}
[data-lang="en"] .venue-name{font-weight:400}
.venue-addr{margin:.35rem 0 0;color:var(--ink-soft)}
.venue-note{margin:.6rem 0 0;font-size:var(--small);color:var(--ink-soft);font-style:italic}

/* footer */
.closing{padding-bottom:2.6rem}
.closing .await{margin:0;font-style:italic;color:var(--ink-soft)}
.closing .hosts{margin:.4rem 0 0;font-family:var(--f-label);letter-spacing:var(--track);font-size:1.08rem;color:var(--emerald-2);text-wrap:balance}
.closing .fam{margin:.1rem 0 0;color:var(--ink-soft);font-size:var(--small)}

/* floating controls */
.fab-row{position:fixed;z-index:40;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:.55rem;align-items:center}
.fab{width:50px;height:50px;border-radius:50%;border:0;background:linear-gradient(180deg,#1f6040,#0f3622);color:var(--gold-hi);display:grid;place-items:center;box-shadow:0 0 0 1px var(--gold),0 8px 20px rgba(0,0,0,.4)}
.fab svg{width:22px;height:22px}
.fab .glyph{font-size:1.05rem;font-weight:700;line-height:1}
.eq{display:flex;gap:3px;align-items:flex-end;height:18px}
.eq i{width:3px;background:var(--gold-hi);border-radius:2px;height:5px}
.fab.playing .eq i{animation:eq 1s ease-in-out infinite}
.fab.playing .eq i:nth-child(2){animation-delay:.2s}
.fab.playing .eq i:nth-child(3){animation-delay:.4s}
.fab.playing .eq i:nth-child(4){animation-delay:.1s}
@keyframes eq{0%,100%{height:5px}50%{height:17px}}
.fab:not(.playing) .eq{opacity:.55}
.lang-menu{position:fixed;z-index:41;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(74px + env(safe-area-inset-bottom,0px));background:var(--ivory);border-radius:12px;padding:.4rem;display:grid;gap:.2rem;box-shadow:0 0 0 1px var(--gold),0 14px 34px rgba(0,0,0,.45);min-width:9.5rem}
.lang-menu button{border:0;background:transparent;text-align:left;padding:.5rem .8rem;border-radius:8px;font-size:1.05rem;color:var(--emerald-2)}
.lang-menu button[aria-current="true"]{background:var(--emerald-2);color:var(--gold-hi)}
.lang-menu button:hover{background:var(--ivory-2)}
.lang-menu button[data-l="te"]{font-family:'Noto Serif Telugu',serif}
.lang-menu button[data-l="kn"]{font-family:'Noto Serif Kannada',serif}
.lang-menu button[data-l="hi"]{font-family:'Tiro Devanagari Hindi',serif}
.lang-menu button[data-l="en"]{font-family:'Cormorant Garamond',serif;font-weight:600}
.toast{position:fixed;z-index:80;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--emerald-2);color:var(--gold-hi);padding:.55rem 1.1rem;border-radius:999px;box-shadow:0 0 0 1px var(--gold);opacity:0;transition:.3s;pointer-events:none;font-size:.95rem}
.toast.show{opacity:1;transform:translate(-50%,0)}

  var now=new Date(), end=new Date(ev.end+':00+05:30');

  gate.classList.add('open');
  setTimeout(petals,700);
  gate.classList.add('gone');
  setTimeout(function(){
    gate.setAttribute('aria-hidden','true');
    document.body.classList.remove('locked');
    $('#fabs').hidden=false;
  },2300);
});

/* ---------- Language menu ---------- */
var menu=$('#lang-menu'), lfab=$('#lang-fab');
lfab.addEventListener('click',function(e){ e.stopPropagation(); menu.hidden=!menu.hidden; lfab.setAttribute('aria-expanded',menu.hidden?'false':'true'); });
$$('#lang-menu button').forEach(function(b){ b.addEventListener('click',function(){ applyLang(b.dataset.l); menu.hidden=true; lfab.setAttribute('aria-expanded','false'); }); });
document.addEventListener('click',function(e){ if(!menu.hidden && !menu.contains(e.target)){ menu.hidden=true; lfab.setAttribute('aria-expanded','false'); } });
